<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Demo de listas de tareas con JavaScript y almacenamiento local.">
  <title>Listas de tareas | Demo JavaScript</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-3">Listas de tareas</h1>
    <p class="text-muted">Aplicación de demostración. Tus listas se guardan en este navegador.</p>
    <form id="listForm" class="form-inline mb-4">
      <label for="listNameInput" class="sr-only">Nombre de la lista</label>
      <input id="listNameInput" class="form-control mr-2 mb-2" type="text" maxlength="80" placeholder="Nombre de la lista" required>
      <button class="btn btn-primary mb-2" type="submit">Crear lista</button>
    </form>
    <div class="form-group">
      <label for="selectList">Lista activa</label>
      <select id="selectList" class="custom-select"></select>
    </div>
    <form id="taskForm" class="form-inline mb-4">
      <label for="taskInput" class="sr-only">Nueva tarea</label>
      <input id="taskInput" class="form-control mr-2 mb-2" type="text" maxlength="200" placeholder="Nueva tarea" required>
      <button class="btn btn-primary mb-2" type="submit">Agregar tarea</button>
    </form>
    <p id="statusMessage" role="status" aria-live="polite" class="text-muted"></p>
    <section id="taskLists" class="row" aria-label="Tus listas de tareas"></section>
  </main>
<script>
(() => {
  'use strict';
  const storageKey = 'todoLists';
  const listForm = document.getElementById('listForm');
  const taskForm = document.getElementById('taskForm');
  const listNameInput = document.getElementById('listNameInput');
  const taskInput = document.getElementById('taskInput');
  const selectList = document.getElementById('selectList');
  const taskLists = document.getElementById('taskLists');
  const status = document.getElementById('statusMessage');

  function loadLists() {
    try {
      const parsed = JSON.parse(localStorage.getItem(storageKey) || '{}');
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
      const output = Object.create(null);
      for (const [name, tasks] of Object.entries(parsed)) {
        if (!Array.isArray(tasks)) continue;
        output[name] = tasks.filter(task => task && typeof task.text === 'string')
          .map(task => ({ text: task.text, completed: Boolean(task.completed) }));
      }
      return output;
    } catch {
      status.textContent = 'No se pudieron recuperar las listas guardadas.';
      return Object.create(null);
    }
  }

  let lists = loadLists();

  function save() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(lists));
    } catch {
      status.textContent = 'No se pudieron guardar los cambios en este navegador.';
    }
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function render() {
    const selected = selectList.value;
    selectList.replaceChildren();
    taskLists.replaceChildren();
    const names = Object.keys(lists);
    for (const name of names) {
      const option = new Option(name, name);
      selectList.add(option);
    }
    if (names.includes(selected)) selectList.value = selected;
    taskForm.querySelector('button').disabled = names.length === 0;
    if (!names.length) {
      status.textContent = 'Creá una lista para comenzar.';
      return;
    }
    if (status.textContent === 'Creá una lista para comenzar.') status.textContent = '';

    for (const name of names) {
      const col = element('article', 'col-md-6 col-lg-4 mb-4');
      const card = element('div', 'card h-100');
      const header = element('div', 'card-header d-flex justify-content-between align-items-center');
      header.append(element('strong', '', name));
      const removeList = element('button', 'btn btn-sm btn-outline-danger', 'Eliminar lista');
      removeList.type = 'button';
      removeList.setAttribute('aria-label', 'Eliminar lista ' + name);
      removeList.addEventListener('click', () => {
        if (!confirm('¿Eliminar la lista "' + name + '" y todas sus tareas?')) return;
        delete lists[name];
        save();
        render();
      });
      header.append(removeList);
      card.append(header);
      const ul = element('ul', 'list-group list-group-flush');
      lists[name].forEach((task, index) => {
        const li = element('li', 'list-group-item d-flex align-items-center');
        const checkbox = element('input', 'mr-2');
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        const id = 'task-' + names.indexOf(name) + '-' + index;
        checkbox.id = id;
        checkbox.addEventListener('change', () => {
          task.completed = checkbox.checked;
          save();
          render();
        });
        const label = element('label', 'mb-0 flex-grow-1' + (task.completed ? ' text-muted' : ''), task.text);
        label.htmlFor = id;
        if (task.completed) label.style.textDecoration = 'line-through';
        const removeTask = element('button', 'btn btn-sm btn-outline-danger ml-2', 'Eliminar');
        removeTask.type = 'button';
        removeTask.setAttribute('aria-label', 'Eliminar tarea ' + task.text);
        removeTask.addEventListener('click', () => {
          lists[name].splice(index, 1);
          save();
          render();
        });
        li.append(checkbox, label, removeTask);
        ul.append(li);
      });
      card.append(ul);
      col.append(card);
      taskLists.append(col);
    }
  }

  listForm.addEventListener('submit', event => {
    event.preventDefault();
    const name = listNameInput.value.trim();
    if (!name) return;
    if (Object.prototype.hasOwnProperty.call(lists, name)) {
      status.textContent = 'Ya existe una lista con ese nombre.';
      return;
    }
    lists[name] = [];
    listNameInput.value = '';
    save();
    render();
    selectList.value = name;
    status.textContent = 'Lista creada.';
  });

  taskForm.addEventListener('submit', event => {
    event.preventDefault();
    const name = selectList.value;
    const text = taskInput.value.trim();
    if (!text || !Object.prototype.hasOwnProperty.call(lists, name)) return;
    lists[name].push({ text, completed: false });
    taskInput.value = '';
    save();
    render();
    status.textContent = 'Tarea agregada.';
  });

  render();
})();
</script>
</body>
</html>
